<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; img-src 'none'; font-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Pharaoh Trace</title>
  <style>
    /* Host tokens first: styles.variables lands on :root. Each fallback is Claude's default, so a host
       that sends none still gets a themed card. Gold and the slice colours are the card's own; the rest is the host's. */
    :root { color-scheme:light dark;
      --ink:var(--color-text-primary,light-dark(#141413,#faf9f5)); --text:var(--color-text-secondary,light-dark(#3d3d3a,#c2c0b6)); --muted:var(--color-text-tertiary,light-dark(#73726c,#9c9a92));
      --rule:var(--color-border-tertiary,light-dark(rgba(31,30,29,.15),rgba(222,220,209,.15))); --track:var(--color-background-secondary,light-dark(#f5f4ed,#262624)); --focus:var(--color-ring-primary,light-dark(rgba(20,20,19,.7),rgba(250,249,245,.7)));
      --red:var(--color-text-danger,light-dark(#7f2c28,#ee8884)); --amber:var(--color-text-warning,light-dark(#5a4815,#d1a041)); --green:var(--color-text-success,light-dark(#265b19,#7ab948));
      --gold:light-dark(#86610c,#d4a843);
      --label-background:light-dark(rgba(255,255,255,.9),rgba(17,17,16,.68)); --label-edge:light-dark(#ffffff,#111110);
      /* Slices are separate things, so they share one lightness and differ by hue. The order alternates warm and cool, which keeps neighbours apart under colour blindness; it clears red, amber and green, which mean error, warning and ok here. */
      --s0:light-dark(#977100,#cca13e); --s1:light-dark(#7d66b9,#ad97ee); --s2:light-dark(#008d65,#4ac094); --s3:light-dark(#5374c1,#81a5f6); --s4:light-dark(#aa5688,#df86ba);
      --s-muted:var(--color-border-primary,light-dark(rgba(31,30,29,.4),rgba(222,220,209,.4))); --s-warning:var(--color-border-warning,light-dark(#805c1f,#a87829)); --s-error:var(--color-border-danger,light-dark(#a73d39,#cd5c58));
      --sans:var(--font-sans,system-ui,-apple-system,"Segoe UI",sans-serif); --mono:var(--font-mono,ui-monospace,SFMono-Regular,Menlo,Consolas,monospace);
      --type-heading:var(--font-heading-md-size,16px); --type-body:var(--font-text-sm-size,14px); --type-caption:var(--font-text-xs-size,12px); --leading:var(--font-text-sm-line-height,1.4);
      --regular:var(--font-weight-normal,400); --strong:var(--font-weight-semibold,600);
      --line:var(--border-width-regular,.5px) solid var(--rule); --radius:var(--border-radius-md,8px); --radius-small:var(--border-radius-xs,4px); }
    :root[data-theme="light"] { color-scheme:light; } :root[data-theme="dark"] { color-scheme:dark; }
    * { box-sizing:border-box; }
    html,body { margin:0; background:transparent; min-width:0; }
    body { padding:var(--safe-top,0) var(--safe-right,0) var(--safe-bottom,0) var(--safe-left,0); }
    .label,.detail,.badge { overflow-wrap:anywhere; min-width:0; unicode-bidi:plaintext; }
    .mark-s { font:var(--strong) var(--type-caption) var(--mono); width:1ch; }
    #trace { color:var(--text); border:var(--line); border-radius:var(--radius); padding:10px 12px; font:var(--regular) var(--type-body)/var(--leading) var(--sans); min-width:0; }
    .head { display:flex; flex-wrap:wrap; align-items:baseline; gap:2px 10px; }
    .headline { flex:1 1 16em; margin:0; min-width:0; overflow-wrap:anywhere; }
    #kind { color:var(--muted); }
    #target { color:var(--ink); font:var(--strong) var(--type-heading)/var(--leading) var(--mono); }
    #target,.legend > span,.rows .label { unicode-bidi:isolate; }
    #title { color:var(--ink); font-size:var(--type-heading); font-weight:var(--strong); }
    #summary { margin-left:8px; }
    .num { color:var(--gold); font-family:var(--mono); font-weight:var(--strong); }
    .meta { margin-left:auto; display:flex; gap:10px; white-space:nowrap; font-size:var(--type-caption); }
    #verdict[data-state="error"] { color:var(--red); } #verdict[data-state="warning"] { color:var(--amber); } #verdict[data-state="ok"] { color:var(--green); }
    #sha { color:var(--muted); font-family:var(--mono); }
    /* Bars are text. Each cell is a tick-sized window onto a caption-size glyph, set apart from the next, so █ reads as a tick, not a rule.
       Whole pixels: a window's edges round the same way, so every tick lands the same width on a 1x screen. */
    .bar,.sw { --tick-width:5px; --tick-height:8px; }
    .mini,.meter { --tick-width:4px; --tick-height:6px; }
    .bar,.mini,.meter,.sw { font:var(--regular) var(--type-caption)/var(--tick-height) var(--mono); letter-spacing:0; font-variant-ligatures:none; -webkit-user-select:none; user-select:none; }
    .bar,.mini,.meter { display:grid; grid-template-columns:repeat(var(--cols),var(--tick-width)); justify-content:space-between; min-width:0; }
    .bar span,.mini span,.meter span,.sw { position:relative; width:var(--tick-width); height:var(--tick-height); overflow:hidden; }
    .bar span,.mini span,.meter span { color:var(--s-muted); }
    .bar span::after,.mini span::after,.meter span::after { content:attr(data-g); position:absolute; inset:0; color:var(--tone,var(--gold)); }
    .bar { margin:8px 0 0; }
    .s0 { --tone:var(--s0); } .s1 { --tone:var(--s1); } .s2 { --tone:var(--s2); } .s3 { --tone:var(--s3); } .s4 { --tone:var(--s4); }
    .muted { --tone:var(--muted); } .warning { --tone:var(--s-warning); } .error { --tone:var(--s-error); }
    .legend { display:flex; flex-wrap:wrap; gap:2px 14px; margin:6px 0 0; color:var(--muted); font-size:var(--type-caption); min-width:0; }
    .legend:empty { display:none; }
    #trace[data-reveal] .legend { opacity:0; }
    .legend b { color:var(--text); font:var(--strong) var(--type-caption) var(--mono); margin-left:4px; }
    .sw { display:inline-block; color:var(--tone); margin-right:5px; }
    .foot { display:flex; justify-content:flex-end; gap:14px; margin-top:6px; }
    .action { display:flex; align-items:center; gap:4px; border:0; background:none; padding:2px 0; color:var(--gold); font:var(--regular) var(--type-caption) var(--sans); cursor:pointer; white-space:nowrap; }
    .action:hover { color:var(--ink); }
    .action:focus-visible,summary:focus-visible { outline:2px solid var(--focus); outline-offset:2px; border-radius:var(--radius-small); }
    .setup-next { margin:10px 0 0; }
    .setup-next p { margin:4px 0; overflow-wrap:anywhere; font-size:var(--type-caption); }
    .setup-choice + .setup-choice { margin-top:8px; }
    .setup-next .action { padding:6px 10px; border:var(--line); border-radius:var(--radius); white-space:normal; }
    .setup-next .recommended { border:1px solid var(--gold); }
    .setup-recommended { color:var(--muted); margin-inline-start:6px; }
    .setup-next .action:disabled { cursor:default; opacity:.7; }
    .chev { display:inline-block; }
    .action[aria-expanded="true"] .chev { transform:rotate(90deg); }
    .caveat { margin:6px 0 0; color:var(--amber); font-size:var(--type-caption); overflow-wrap:anywhere; }
    .caveat span + span::before { content:" · "; color:var(--muted); }
    .rows { list-style:none; margin:4px 0 0; padding:0; font-size:var(--type-caption); }
    .rows li { display:flex; flex-wrap:wrap; align-items:baseline; gap:0 8px; padding:4px 0 5px; border-top:var(--line); min-width:0; }
    .rows li:first-child { border-top:0; }
    .rows .kind { color:var(--muted); }
    .rows .label { color:var(--ink); font-family:var(--mono); }
    .rows .prose { color:var(--text); font-family:var(--sans); }
    .rows .detail { color:var(--text); }
    .rows .end { margin-left:auto; white-space:nowrap; }
    .rows .more { color:var(--muted); }
    .rows .mini { flex:1 0 100%; margin-top:4px; }
    [data-state="ok"] > .mark-s { color:var(--green); } [data-state="warning"] > .mark-s, [data-state="pending"] > .mark-s { color:var(--amber); } [data-state="error"] > .mark-s, .end[data-state="error"] { color:var(--red); } .end[data-state="warning"] { color:var(--amber); }
    .drawer { display:grid; grid-template-rows:0fr; }
    .drawer[data-open] { grid-template-rows:1fr; }
    .drawer-inner { overflow:hidden; min-height:0; }
    .drawer[data-open] .drawer-inner { border-top:var(--line); margin-top:8px; padding-top:4px; }
    ul.tree,.tree ul { list-style:none; margin:0; padding:0; }
    .tree ul { margin:0 0 4px 6px; padding-left:10px; border-left:var(--line); }
    .tree summary,.leaf { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:10px; align-items:baseline; padding:3px 0; font-size:var(--type-caption); min-width:0; }
    .tree summary { list-style:none; cursor:pointer; color:var(--text); }
    .tree summary::-webkit-details-marker { display:none; }
    .tree summary:hover { background:var(--track); }
    .tree summary .label::before { content:"▸"; display:inline-block; color:var(--gold); width:1em; }
    .tree details[open] > summary .label::before { transform:rotate(90deg); }
    .tree details[open] > summary .label { color:var(--gold); }
    .leaf .label { color:var(--ink); font-family:var(--mono); }
    .tree > li > .leaf { padding-left:1em; }
    .tree > li > .leaf .label { color:var(--text); font-family:var(--sans); }
    .tree .label .detail { color:var(--muted); font-family:var(--mono); margin-left:8px; }
    .tree .label .caveat { color:var(--amber); font-family:var(--sans); margin:0 0 0 8px; }
    .badge { color:var(--muted); font-family:var(--mono); text-align:right; white-space:nowrap; }
    .badge[data-state="ok"] { color:var(--green); } .badge[data-state="warning"],.badge[data-state="pending"] { color:var(--amber); } .badge[data-state="error"] { color:var(--red); }
    .meter { margin-top:4px; max-width:190px; }
    .notes,.provenance { color:var(--muted); font-size:var(--type-caption); margin:6px 0 2px; }
    .notes p { margin:2px 0; overflow-wrap:anywhere; white-space:pre-wrap; }
    #fallback { font:var(--regular) var(--type-caption)/1.5 var(--mono); color:var(--text); margin:6px 0 0; white-space:pre-wrap; overflow-wrap:anywhere; unicode-bidi:plaintext; }
    /* The landing map's connected glyph trail, used as an abstract activity illustration. */
    #trace[data-activity] { padding:0; border:0; }
    #trace[data-activity] > :where(:not(#activity):not(#foot):not(#drawer)) { display:none; }
    #trace[data-activity] > #foot { margin:0 12px 6px; }
    #trace[data-activity] > #drawer { margin:0 12px; }
    #trace[data-activity][data-details] > .head { display:flex; margin:8px 12px 0; }
    #trace[data-activity][data-details] > #bar:not([hidden]) { display:grid; margin-inline:12px; }
    #trace[data-activity][data-details] > #legend:not([hidden]):not(:empty) { display:flex; margin-inline:12px; }
    #trace[data-activity][data-details] > #caveat:not([hidden]),#trace[data-activity][data-details] > #rows:not([hidden]) { display:block; margin-inline:12px; }
    #activity { overflow:hidden; padding:0 4px 10px; }
    .activity-figure { position:relative; }
    #activity-svg { display:block; width:100%; height:240px; }
    :root:not([data-display="fullscreen"]) body[data-compact] #activity-svg { height:120px; }
    .activity-figure text { font-family:var(--mono); dominant-baseline:central; text-anchor:middle; }
    .activity-route { opacity:1; visibility:var(--visible,visible); }
    .activity-route text { fill:var(--gold); }
    .activity-node { opacity:1; }
    .activity-node text { fill:var(--gold); filter:drop-shadow(0 0 4px var(--gold)); }
    #activity-labels { position:absolute; inset:0; pointer-events:none; }
    .activity-entity { position:absolute; left:var(--x); top:var(--y); width:32%; transform:translateX(-50%); text-align:center; font:var(--regular) var(--type-caption)/var(--leading) var(--mono); text-shadow:0 0 4px var(--track),0 0 3px var(--track),0 0 2px var(--track); pointer-events:auto; }
    .activity-entity:focus-visible { outline:2px solid var(--focus); outline-offset:2px; }
    .activity-entity strong,.activity-entity small { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .activity-entity strong { color:var(--gold); font-size:calc(var(--type-caption) * .92); font-weight:var(--strong); line-height:1.2; }
    .activity-entity small { color:var(--muted); font-size:calc(var(--type-caption) * .86); }
    .activity-entity[data-origin] { width:30%; transform:none; text-align:left; }
    :root:not([data-display="fullscreen"]) body[data-compact] .activity-entity { width:29%; padding:1px 4px; border-radius:2px; background:var(--label-background); -webkit-text-stroke:2px var(--label-edge); paint-order:stroke fill; text-shadow:0 0 3px var(--label-edge); }
    :root:not([data-display="fullscreen"]) body[data-compact] .activity-entity strong { font-size:calc(var(--type-caption) * .82); }
    :root:not([data-display="fullscreen"]) body[data-compact] .activity-entity small { font-size:calc(var(--type-caption) * .74); }
    .activity-caption { display:flex; justify-content:space-between; align-items:center; padding:0 12px; font:var(--regular) var(--type-caption)/var(--leading) var(--mono); }
    .activity-brand { color:var(--gold); letter-spacing:.14em; }
    .activity-state { display:flex; align-items:center; flex-wrap:wrap; justify-content:flex-end; gap:4px 12px; }
    #activity-verdict[data-state="error"] { color:var(--red); }
    #activity-verdict[data-state="warning"] { color:var(--amber); }
    #activity-verdict[data-state="ok"] { color:var(--green); }
    #activity-label { color:var(--text); }
    .activity-notice { margin:5px 12px 0; color:var(--muted); font:var(--regular) var(--type-caption)/var(--leading) var(--sans); overflow-wrap:anywhere; }
    .activity-value { margin:8px 12px 0; padding-top:8px; border-top:var(--line); font:var(--regular) var(--type-caption)/var(--leading) var(--sans); overflow-wrap:anywhere; }
    .activity-value > p { margin:0; color:var(--gold); }
    .activity-value details { margin-top:4px; color:var(--muted); }
    .activity-value summary { cursor:pointer; width:fit-content; }
    .activity-value details p { margin:5px 0; }
    .activity-value .action { margin-top:5px; }
    #activity[data-phase="partial"] #activity-label { color:var(--amber); }
    #activity[data-phase="failed"] #activity-label { color:var(--red); }
    @media(prefers-reduced-motion:no-preference) {
      .activity-route,.activity-node[data-node="finding"] { animation:activity-build .14s ease-out both; animation-delay:calc(var(--at) * 1ms + var(--start,0ms)); animation-play-state:var(--play,running); }
      .activity-entity:not([data-origin]) { animation:activity-label-in .16s ease-out backwards; animation-delay:calc(var(--at) * 1ms); }
      #activity[data-phase="failed"] *,#activity[data-phase="cancelled"] * { animation-play-state:paused; }
      @keyframes activity-build { from { opacity:0; filter:drop-shadow(0 0 5px var(--gold)); } to { opacity:1; } }
      @keyframes activity-label-in { from { opacity:0; visibility:hidden; } to { opacity:1; visibility:visible; } }
    }
    @media(max-width:400px) { #trace { padding:8px 10px; } #summary { margin-left:0; } #summary:not([hidden]) { display:block; } .tree summary,.leaf { grid-template-columns:minmax(0,1fr); gap:0; } .badge { text-align:left; } }
    /* A finger needs 44pt: the MCP Apps minimum for anything tappable. */
    @media(pointer:coarse) { .action { min-height:44px; min-width:44px; justify-content:center; } .tree summary { min-height:44px; align-items:center; } .foot { gap:8px; } }
    /* Inline cards can't scroll, so full screen is where long Details go: the page scrolls and they stay open. */
    :root[data-display="fullscreen"],:root[data-display="fullscreen"] body { height:100%; }
    :root[data-display="fullscreen"] body { overflow-y:auto; }
    :root[data-display="fullscreen"] #trace { border:0; border-radius:0; }
    /* The frame is short for a moment before a taller result is sized: a scrollbar then would shrink the card and redraw its bars mid-arrival. */
    :root:not([data-display="fullscreen"]) { scrollbar-width:none; }
    /* Motion only for people who have not asked to reduce it. */
    @media(prefers-reduced-motion:no-preference) {
      #trace:not([data-settled]) .bar span::after,#trace:not([data-settled]) .mini span::after { animation:tick 1ms calc(var(--i) * .7s / var(--cols)) backwards; }
      @keyframes tick { from { opacity:0; } }
      .legend { transition:opacity .4s ease .2s; }
      .chev { transition:transform .3s ease; }
      .drawer { transition:grid-template-rows .3s ease; }
      .tree summary .label::before { transition:transform .2s ease; }
      #trace[data-state="pending"] .bar span::after,#trace[data-state="waiting"] .bar span::after { content:"█"; color:var(--gold); opacity:0; animation:walk 1.5s linear calc(var(--i) * 1.5s / var(--cols)) infinite; }
      @keyframes walk { from { opacity:1; } 16%,to { opacity:0; } }
    }
    [hidden] { display:none; }
  </style>
</head>
<body data-compact>
  <main id="trace" data-state="waiting">
    <section id="activity" aria-label="Pharaoh activity" hidden>
      <div class="activity-figure">
        <svg id="activity-svg" viewBox="0 0 660 280" preserveAspectRatio="xMidYMid meet" aria-hidden="true" focusable="false"></svg>
        <div id="activity-labels"></div>
      </div>
      <div class="activity-caption"><span class="activity-brand">PHARAOH</span><span class="activity-state"><span id="activity-verdict" hidden></span><span id="activity-label" role="status" aria-live="polite">Ready</span></span></div>
      <p id="activity-notice" class="activity-notice" hidden></p>
      <div id="activity-value" class="activity-value" hidden>
        <p id="activity-value-text"></p>
        <details id="activity-value-details" hidden>
          <summary>Estimate details</summary>
          <p id="activity-value-scope"></p>
          <button id="activity-value-method" class="action" type="button" hidden>How we estimate</button>
          <p id="activity-value-status" role="status" hidden></p>
        </details>
      </div>
    </section>
    <div class="head">
      <p class="headline"><span id="kind"></span><span id="target"></span><span id="title">Pharaoh</span><span id="summary" role="status" aria-live="polite">Waiting for the tool</span></p>
      <span class="meta"><span id="verdict" hidden></span><span id="sha" hidden></span></span>
    </div>
    <div id="bar" class="bar" aria-hidden="true"></div>
    <p id="legend" class="legend"></p>
    <p id="caveat" class="caveat" hidden></p>
    <ul id="rows" class="rows" hidden></ul>
    <div id="setup-next" class="setup-next" hidden>
      <div class="setup-choice">
        <button id="setup-explore" class="action recommended" type="button" aria-describedby="setup-recommended setup-explore-note">Find something worth building</button>
        <span id="setup-recommended" class="setup-recommended">Recommended</span>
        <p id="setup-explore-note">Get one idea you could ship with the code you already have.</p>
      </div>
      <div class="setup-choice">
        <button id="setup-audit" class="action" type="button" aria-describedby="setup-audit-note">Run a codebase audit</button>
        <p id="setup-audit-note">See what to fix first and how to track your Codebase Health.</p>
      </div>
      <p id="setup-explore-status" role="status" hidden></p>
      <p id="setup-explore-fallback" hidden>Ask in chat: <q id="setup-fallback-request"></q></p>
    </div>
    <div id="foot" class="foot" hidden>
      <button id="toggle" class="action" type="button" aria-expanded="false" aria-controls="drawer" hidden><span id="toggle-label">Details</span><span class="chev" aria-hidden="true">▸</span></button>
      <button id="expand" class="action" type="button" hidden></button>
    </div>
    <div id="drawer" class="drawer" inert>
      <div class="drawer-inner">
        <ul id="tree" class="tree" aria-label="Result evidence"></ul>
        <pre id="fallback" hidden></pre>
        <div id="notes" class="notes" hidden></div>
        <p id="provenance" class="provenance" hidden></p>
      </div>
    </div>
  </main>
  <script>
    (() => {
      "use strict";
      const META_KEY = "so.pharaoh/trace";
      const SETUP_OPPORTUNITY_KEY = "so.pharaoh/setup-opportunity";
      const SETUP_LIMITS =
        "Stay read-only. Make no edits, memory saves, or messages to others. Use at most six Pharaoh graph calls and six focused source reads. Respect freshness, access, and plan limits.";
      const SETUP_REQUESTS = {
        "setup-explore": "Use Pharaoh to find one thing worth building in this repo. Start with its codebase map. " +
          "If you know what I am working on, use it to find a feature that helps. Otherwise, surprise me with one useful idea. " +
          "Use the graph and focused source reads to verify existing capabilities. Explain who it helps and the smallest useful version. " +
          "Separate what exists from what you would add and link up to three verified source locations. " +
          "If evidence is thin, say what you could verify. End by inviting me to build the first version.",
        "setup-audit": "Use Pharaoh to run a codebase audit. Start with get_codebase_map for this repo with include_health: true. " +
          "Use the mapped commit's Codebase Health baseline when available. Follow the strongest signals with targeted graph calls and verify them in source. " +
          "Give up to three findings in priority order, with verified code links, practical impact, and a next step for each. " +
          "Explain which findings affect measured Health drivers (exact clones, dependency cycles, or complexity). Treat other risks separately. " +
          "Say what you covered and what to recheck after remapping. If the baseline is unavailable or evidence is thin, say so. Do not predict a score change."
      };
      const PROTOCOL_VERSION = "2026-01-26";
      // Kept in parity with TRACE_LIMITS in trace-contract.ts by the resource test.
      const LIMITS = { bytes:65536, nodes:120, depth:6, label:512, detail:2048, badge:128, summary:1024, notes:16, note:1024, repo:256, segments:8, valueText:256, valueScope:1024, valueUrl:2048 };
      const MAX_TEXT = 32768;
      const MAX_ROWS = 5;
      // Px from one tick to the next, its width plus the gap: a wider card gets more ticks, not fatter ones.
      const TICK_PITCH = {bar:7,mini:6};
      const TICK_GAP = 2;
      // Lays bars out while the frame has no width yet; the first resize refits them.
      const FALLBACK_WIDTH = 340;
      const METER_CELLS = 32;
      const BLOCKS = ["","▏","▎","▍","▌","▋","▊","▉","█"];
      const TONES = ["warning","error","muted"];
      const STATES = ["ok","pending","warning","error"];

        for (const [,index] of shortest.slice(0,Math.max(0,spare))) cells[index]++;
        for (let over = -spare; over > 0; over--) cells[cells.indexOf(Math.max(...cells))]--;
        return cells;
      }
      // Every cell is a ░ with its real glyph laid over it, so a bar fills in over its own track.
      function cell(target,tone,glyph) {
        const node = element("span",tone,"░");
        if (glyph) node.dataset.g = glyph;
        node.style.setProperty("--i",target.childElementCount);
        target.append(node);
      }
      const blockFor = item => item.tone === "muted" ? "░" : "█";
      const colsFor = ({target,shown},width) => Math.max(shown.length * 2 - 1,Math.floor(((width || FALLBACK_WIDTH) + TICK_GAP) / TICK_PITCH[target.className]));
      // One empty cell separates slices: ticks have no edge of their own to tell two golds apart.
      function drawBar(bar,width) {
        const {target,shown} = bar;
        bar.cols = colsFor(bar,width);
        const counts = allocate(shown.map(item => item.value),bar.cols - shown.length + 1);
        target.style.setProperty("--cols",bar.cols);
        target.replaceChildren();
        let shade = 0;
        shown.forEach((item,position) => {
          if (position) target.append(element("span"));
          const tone = item.tone || `s${Math.min(shade++,4)}`;
          for (let count = counts[position]; count > 0; count--) cell(target,tone,blockFor(item));
        });
        while (target.childElementCount < bar.cols) cell(target);
      }
      function addBar(target,items) {
        const bar = {target,shown:items.filter(item => item.value > 0)};
        bars.push(bar);
        drawBar(bar,head.clientWidth);
      }
      // A new column count redraws a bar, without the arrival motion. Smaller changes are the cell spacing's to absorb, so running motion is left alone.
      function refit() {
        const width = head.clientWidth;
        const stale = bars.filter(bar => colsFor(bar,width) !== bar.cols);
        if (!stale.length) return;
        root.dataset.settled = "";
        for (const bar of stale) drawBar(bar,width);
      }
      // The empty bar shown until a result arrives.
      function showTrack() {
        addBar(fields.bar,[]);
        fields.bar.hidden = false;
      }
      // The bars fill by themselves in CSS; the legend fades in once they have painted.
      function reveal() {
        requestAnimationFrame(() => requestAnimationFrame(() => { delete root.dataset.reveal; }));
      }
      function legend(items) {
        let shade = 0;
        for (const item of items.filter(item => item.value > 0)) {
          const entry = element("span");
          const swatch = element("span",`sw ${item.tone || `s${Math.min(shade++,4)}`}`,blockFor(item));
          swatch.setAttribute("aria-hidden","true");
          entry.append(swatch,item.label,element("b","",compact.format(item.value)));
          fields.legend.append(entry);
        }
      }
      function verdict(target,value) {
        if (!value) return;
        target.textContent = value.label;
        if (value.status) target.dataset.state = value.status;
        target.hidden = false;
      }
      // Sections (recon) and status lines (states, named checks) stay visible; groups open on demand.
      function rowFor(node) {
        const item = element("li");
        if (node.status) {
          item.dataset.state = node.status;
          item.append(element("span","mark-s",{ok:"✓",pending:"…",warning:"!",error:"×"}[node.status]));
        }
        const split = splitTitle(node.label);
        if (split) item.append(element("span","kind",split[1]));
        // Names read in monospace; sentences (state messages) read as prose.
        item.append(element("span",split || !/\s/.test(node.label) ? "label" : "label prose",split ? split[2] : node.label));
        if (node.detail) { const detail = element("span","detail"); rich(detail,node.detail); item.append(detail); }
        const end = element("span","end",node.badge || "");
        end.hidden = !node.badge;
        if (node.glance?.verdict) { end.hidden = true; verdict(end,node.glance.verdict); }
        item.append(end);
        if (node.glance?.caveat) item.append(element("span","detail caveat",node.glance.caveat));
        if (node.glance?.segments?.length) {
          const mini = element("span","mini");
          mini.setAttribute("aria-hidden","true");
          addBar(mini,node.glance.segments);
          item.append(mini);
        }
        return item;
      }
      function renderNode(node) {
        const item = element("li");
        const group = Array.isArray(node.children) && node.children.length > 0;
        const row = element(group ? "summary" : "div",group ? "" : "leaf");
        const label = element("span","label",node.label);
        if (node.detail) label.append(element("span","detail",node.detail));
        if (node.meter) {
          const meter = element("span","meter");
          meter.title = `${node.meter.value} / ${node.meter.total}`;
          meter.setAttribute("aria-hidden","true");
          meter.style.setProperty("--cols",METER_CELLS);
          // Eighths of a cell, and never none: a tiny value still shows. The window clips the top three to look full.
          const eighths = Math.max(1,Math.round(node.meter.value / node.meter.total * METER_CELLS * 8));
          for (let index = 0; index < METER_CELLS; index++) cell(meter,"",BLOCKS[Math.min(8,Math.max(0,eighths - index * 8))]);
          label.append(meter);
        }
        if (node.glance?.caveat) label.append(element("span","caveat",node.glance.caveat));
        const symbol = {ok:"✓",pending:"…",warning:"!",error:"×"}[node.status] || "";
        const badge = element("span","badge",[symbol,node.badge || node.glance?.verdict?.label].filter(Boolean).join(" "));
        const state = node.status || node.glance?.verdict?.status;
        if (state) badge.dataset.state = state;
        row.append(label,badge);
        if (!group) { item.append(row); return item; }
        const details = element("details");
        const children = element("ul");
        for (const child of node.children) children.append(renderNode(child));
        details.append(row,children);
        item.append(details);
        return item;
      }
      function renderView(view) {
        clearResult();
        currentView = view;
        cancelled = false;
        root.dataset.state = "ready";
        root.dataset.reveal = "";
        const glance = view.glance || {};
        headline(view.title,view.summary);
        verdict(fields.verdict,glance.verdict);
        const freshness = view.freshness;
        if (freshness?.mappedCommit) {
          display("sha",`@${/^[0-9a-f]{7,}$/i.test(freshness.mappedCommit) ? freshness.mappedCommit.slice(0,7) : freshness.mappedCommit.slice(0,12)}`);
          fields.sha.title = `Mapped ${freshness.mappedCommit}${freshness.lastAnalyzed ? ` as of ${freshness.lastAnalyzed}` : ""}`;
        }
        if (freshness) display("provenance",[freshness.mappedCommit ? `Mapped ${freshness.mappedCommit}` : "Mapped commit unknown",freshness.lastAnalyzed ? `as of ${freshness.lastAnalyzed}` : "map time unknown",`status: ${freshness.status}`].join(" · "));
        caveats([glance.caveat,freshness?.status === "stale" ? "Map is behind the latest push" : ""].filter(Boolean));
        const shown = glance.segments?.some(item => item.value > 0);
        if (shown) addBar(fields.bar,glance.segments);
        fields.bar.hidden = !shown;
        legend(glance.segments || []);
        // Up to MAX_ROWS rows, warnings and verdicts first, shown in their original order.
        const candidates = view.nodes.filter(node => node.glance || node.status);
        const urgent = node => node.status === "error" || node.status === "warning" || node.glance?.verdict || node.glance?.caveat;
        const chosen = new Set([...new Set([...candidates.filter(urgent),...candidates])].slice(0,MAX_ROWS));
        const visible = candidates.filter(node => chosen.has(node));
        for (const node of visible) fields.rows.append(rowFor(node));
        if (candidates.length > visible.length) fields.rows.append(element("li","more",`+${candidates.length - visible.length} more in Details`));
        fields.rows.hidden = visible.length === 0;
        for (const node of view.nodes) if (!visible.includes(node) || node.children?.length) fields.tree.append(renderNode(node));
        // One click on Details shows evidence: the first group is already open inside the drawer.
        fields.tree.querySelector("details")?.setAttribute("open","");
        notes(view.notes || []);
        hasDetails = fields.tree.childElementCount > 0 || !fields.notes.hidden || !fields.provenance.hidden;
        showActions();
        reveal();
        const outcome = activityOutcome(view);
        verdict(activityVerdict,outcome.verdict);
        showActivity(outcome.phase,view);
        showActivityNotice(outcome.notice);
        showActivityValue(view,outcome);
      }
      function input(params,partial = false) {
        if (partial && (inputComplete || resultReceived)) return;
        const args = record(params.arguments) ? params.arguments : {};
        const target = ["entity","query","module","repo"].map(key => args[key]).find(value => string(value,LIMITS.repo) && value.trim()) || "";
        const preservePath = activityLayout && !resultReceived && activityTarget === target;
        fields["setup-next"].hidden = true;
        cancelled = false;
        clearResult();
        if (!partial) {
          inputComplete = true;
          resultReceived = false;
        }
        root.dataset.state = "pending";
        activityTarget = target;
        activityEntities = [];
        const verb = Object.hasOwn(VERBS,tool) ? VERBS[tool] : "Querying the Pharaoh graph";
        headline("","");
        display("kind",target ? `${verb} ` : `${verb}…`);
        display("target",target ? `${target}…` : "");
        showTrack();
        showActivity("working",undefined,!preservePath);
      }
      function result(params) {
        if (cancelled) return;
        resultReceived = true;
        const text = readableText(params);
        const omission = text.omitted ? "Text shortened for this view. The full tool response remains in chat." : "";
        if (params.isError === true) {
          fallback("Request failed",text.text,omission,"error");
          return;
        }
        const view = record(params._meta) ? params._meta[META_KEY] : undefined;
        if (validView(view)) {
          renderView(view);
          setupExploreRepo = params._meta[SETUP_OPPORTUNITY_KEY] === true && /^[\w.-]+(?:\/[\w.-]+)?$/.test(view.repo || "") ? view.repo : "";
          fields["setup-next"].hidden = !setupExploreRepo;
        }
        else fallback("Tool response",text.text,[view === undefined ? "" : "Trace metadata could not be displayed; showing the tool's text response.",omission].filter(Boolean).join(" "));
      }
      function context(params) {
        // Updates carry only the fields that changed.
        if (params.theme === "dark" || params.theme === "light") page.dataset.theme = params.theme;
        const variables = params.styles?.variables;
        if (record(variables)) for (const [name,value] of Object.entries(variables)) if (HOST_VARIABLE.test(name) && string(value,MAX_HOST_VALUE)) page.style.setProperty(name,value);
        const insets = params.safeAreaInsets;
        if (record(insets)) for (const side of ["top","right","bottom","left"]) if (Number.isFinite(insets[side]) && insets[side] >= 0) page.style.setProperty(`--safe-${side}`,`${insets[side]}px`);
        if (Array.isArray(params.availableDisplayModes)) hostModes = params.availableDisplayModes;
        if (DISPLAY_MODES.includes(params.displayMode)) setDisplay(params.displayMode);
        const previousTool = tool;
        const name = params.toolInfo?.tool?.name;
        if (string(name,128)) tool = name;
        if (ACTIVITY_TOOLS.includes(tool)) {
          if (currentView && previousTool !== tool) {
            const open = fields.drawer.hasAttribute("data-open");
            renderView(currentView);
            setOpen(open);
          } else if (!resultReceived && !activity.hasAttribute("data-phase")) {
            showActivity(root.dataset.state === "pending" ? "working" : "waiting");
          }
        } else {
          delete root.dataset.activity;
          activity.hidden = true;
        }
        showActions();
      }
      function size() {
        if (!ready || closed || resizeFrame) return;
        resizeFrame = requestAnimationFrame(() => {
          resizeFrame = 0;
          refit();
          positionActivityLabels();
          const height = Math.ceil(document.body.getBoundingClientRect().height);
          const width = Math.ceil(document.documentElement.clientWidth);
          if (height !== lastHeight || width !== lastWidth) {
            lastHeight = height;
            lastWidth = width;
            send({method:"ui/notifications/size-changed",params:{height,width}});
          }
        });
      }
      const observer = typeof ResizeObserver === "function" ? new ResizeObserver(size) : null;
      observer?.observe(root);
      root.addEventListener("toggle",size,true);
      root.addEventListener("transitionend",size);
      window.addEventListener("resize",size);
      fields.toggle.addEventListener("click",() => { setOpen(fields.toggle.getAttribute("aria-expanded") !== "true"); size(); });
      fields.expand.addEventListener("click",() => send({id:`${displayId}${++displayRequests}`,method:"ui/request-display-mode",params:{mode:displayMode === "fullscreen" ? "inline" : "fullscreen"}}));
      activityValueMethod.addEventListener("click",() => {
        if (!ready || closed || !canOpenLinks || !valueMethodUrl || methodRequestId) return;
        methodRequestId = methodId + ++methodRequests;
        activityValueStatus.textContent = "Opening the estimate method…";
        activityValueStatus.hidden = false;
        send({id:methodRequestId,method:"ui/open-link",params:{url:valueMethodUrl}});
        size();
      });
      function setupExploreFallback(message) {
        display("setup-explore-status",message);
        fields["setup-explore-fallback"].hidden = false;
        size();
      }
      function sendSetupRequest(request) {
        if (!ready || closed || cancelled || fields["setup-next"].hidden || setupExploreSent) return;
        setupExploreSent = true;
        fields["setup-explore"].disabled = true;
        fields["setup-audit"].disabled = true;
        const text = `${request} ${SETUP_LIMITS} The repo is ${setupExploreRepo}.`;
        fields["setup-fallback-request"].textContent = text;
        display("setup-explore-status","Sending request to your agent…");
        setupExploreTimeout = setTimeout(() => {
          setupExploreFallback("Check whether your agent started before asking again.");
        },10000);
        send({id:setupExploreId,method:"ui/message",params:{role:"user",content:[{type:"text",text}]}});
        size();
      }
      for (const [id,request] of Object.entries(SETUP_REQUESTS)) {
        fields[id].addEventListener("click",() => sendSetupRequest(request));
      }
      function receive(event) {
        if (closed || event.source !== window.parent || !record(event.data) || event.data.jsonrpc !== "2.0") return;
        const message = event.data;
        if (message.id === initId && message.method === undefined) {
          if (ready) return;
          if (!record(message.result) || message.result.protocolVersion !== PROTOCOL_VERSION || message.error) {
            clearTimeout(initTimeout);
            fallback("Text response available","Read the tool response in chat.","This host could not initialize Trace.");
            return;
          }
          ready = true;
          clearTimeout(initTimeout);
          canOpenLinks = record(message.result.hostCapabilities) && record(message.result.hostCapabilities.openLinks);
          if (record(message.result.hostContext)) context(message.result.hostContext);
          send({method:"ui/notifications/initialized",params:{}});
          size();
          return;
        }
        if (typeof message.id === "string" && message.id.startsWith(methodId) && message.method === undefined) {
          if (message.id !== methodRequestId) return;
          methodRequestId = "";
          const failed = message.error || !record(message.result) || message.result.isError === true;
          activityValueStatus.textContent = failed ? "This host could not open the estimate method." : "";
          activityValueStatus.hidden = !failed;
          size();
          return;
        }
        // The host answers with the mode it actually set, which may not be the one requested.
        if (typeof message.id === "string" && message.id.startsWith(displayId) && message.method === undefined) {
          if (DISPLAY_MODES.includes(message.result?.mode)) setDisplay(message.result.mode);
          size();
          return;
        }
        if (message.id === setupExploreId && message.method === undefined) {
          if (!setupExploreSent || setupExploreAcknowledged) return;
          setupExploreAcknowledged = true;
          clearTimeout(setupExploreTimeout);
          if (message.error || !record(message.result) || message.result.isError === true) {
            setupExploreFallback("This chat couldn't send the request.");
          } else {
            display("setup-explore-status","Request sent to your agent.");
            fields["setup-explore-fallback"].hidden = true;
            size();
          }
          return;
        }
        const request = typeof message.id === "string" || typeof message.id === "number";
        if (request) {
          if (message.method === "ping") send({id:message.id,result:{}});
          else if (message.method === "ui/resource-teardown") {
            send({id:message.id,result:{}});
            closed = true;
            clearTimeout(initTimeout);
            clearTimeout(setupExploreTimeout);
            cancelAnimationFrame(resizeFrame);
            observer?.disconnect();
            root.dataset.state = "ready";
            showActivity("cancelled");
            window.removeEventListener("message",receive);
          } else send({id:message.id,error:{code:-32601,message:"Unsupported request"}});
          return;
        }
        if (!ready || !record(message.params)) return;
        if (message.method === "ui/notifications/tool-input") input(message.params);
        else if (message.method === "ui/notifications/tool-input-partial") input(message.params,true);
        else if (message.method === "ui/notifications/tool-result") result(message.params);
        else if (message.method === "ui/notifications/tool-cancelled") {
          cancelled = true;
          resultReceived = true;
          fallback("Request cancelled",string(message.params.reason,LIMITS.detail) ? message.params.reason : "The host cancelled this tool request.","","cancelled");
        } else if (message.method === "ui/notifications/host-context-changed") context(message.params);
        size();
      }
      window.addEventListener("message",receive);
      showTrack();
      const initTimeout = setTimeout(() => {
        if (!ready && !closed) fallback("Text response available","Read the tool response in chat.","Trace has not received a host connection.");
      },10000);
      send({id:initId,method:"ui/initialize",params:{appInfo:{name:"Pharaoh Trace",version:"1.7.1"},appCapabilities:{availableDisplayModes:DISPLAY_MODES},protocolVersion:PROTOCOL_VERSION}});
    })();
  </script>
</body>
</html>
